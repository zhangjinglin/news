<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点聚合 · 我的资讯墙</title>
<meta name="description" content="精选 6 个资讯源的轻量热点聚合:知乎热搜、知乎热榜、V2EX、IT之家AI、虎嗅、Linux DO,手动刷新即看最新。">
<style>
  :root {
    --bg: #f4f5fb;
    --bg-glow-1: #e8edff;
    --bg-glow-2: #fdf3e7;
    --card: #ffffff;
    --ink: #161a26;
    --muted: #6b7280;
    --faint: #9ca3af;
    --line: #e8eaf2;
    --hover: #f5f7ff;
    --accent: #4f46e5;
    --accent-2: #7c3aed;
    --shadow: 0 1px 2px rgba(16, 24, 64, .05), 0 12px 32px -12px rgba(16, 24, 64, .18);
    --shadow-hover: 0 2px 4px rgba(16, 24, 64, .06), 0 20px 44px -12px rgba(16, 24, 64, .25);
    --radius: 18px;
  }
  [data-theme="dark"] {
    --bg: #0b0e17;
    --bg-glow-1: #141a35;
    --bg-glow-2: #241a10;
    --card: #121627;
    --ink: #eef1f8;
    --muted: #9aa3b8;
    --faint: #5f6b84;
    --line: #212842;
    --hover: #182036;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 16px 40px -12px rgba(0, 0, 0, .6);
    --shadow-hover: 0 2px 6px rgba(0, 0, 0, .5), 0 24px 52px -12px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 480px at 8% -80px, var(--bg-glow-1), transparent 60%),
      radial-gradient(760px 420px at 95% -60px, var(--bg-glow-2), transparent 60%),
      var(--bg);
    min-height: 100vh;
    transition: background .3s, color .3s;
  }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 28px 24px 64px; }

  header.hero {
    display: flex; flex-wrap: wrap; gap: 18px;
    align-items: flex-end; justify-content: space-between;
    margin-bottom: 22px;
  }
  .title h1 {
    margin: 0; font-size: clamp(26px, 3.4vw, 38px); letter-spacing: -0.5px;
    background: linear-gradient(100deg, var(--ink) 30%, var(--accent) 70%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
  .title p b { color: var(--ink); }

  .toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 9px 16px; min-width: 230px;
    box-shadow: var(--shadow);
  }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--ink);
    font-size: 14px; width: 100%;
  }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 10px 18px; font-size: 14px; font-weight: 600;
    cursor: pointer; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); background: var(--hover); }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 2px 0 14px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 8px 20px; font-size: 14px; font-weight: 600;
    cursor: pointer; box-shadow: var(--shadow); transition: all .18s;
  }
  .tab:hover { color: var(--ink); transform: translateY(-1px); }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; border: 0;
  }
  .card.hidden { display: none; }

  .meta { color: var(--faint); font-size: 12.5px; margin: 0 0 18px; }

  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden;
    transition: transform .2s, box-shadow .25s;
    position: relative;
  }
  .card::before {
    content: ""; height: 4px; display: block;
    background: linear-gradient(90deg, var(--ac), transparent 130%);
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .card-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 16px 12px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 16px;
    background: linear-gradient(135deg, var(--ac), color-mix(in srgb, var(--ac) 55%, #000));
    box-shadow: 0 8px 18px -8px var(--ac);
  }
  .card-head h2 { margin: 0; font-size: 16.5px; }
  .card-head small { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; font-weight: 400; }
  .count {
    margin-left: auto; font-size: 12px; color: var(--muted);
    background: var(--hover); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .list { list-style: none; margin: 0; padding: 4px 8px 8px; overflow-y: auto; max-height: 330px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list li a {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 9px 10px; border-radius: 12px; text-decoration: none; color: var(--ink);
    transition: background .15s;
  }
  .list li a:hover { background: var(--hover); }
  .rank {
    min-width: 24px; height: 24px; border-radius: 8px; margin-top: 1px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: var(--muted);
    background: var(--hover); border: 1px solid var(--line);
  }
  li:nth-child(1) .rank { background: linear-gradient(135deg, #ff5f6d, #ff8f5c); color: #fff; border: 0; }
  li:nth-child(2) .rank { background: linear-gradient(135deg, #ff9a3d, #ffc53d); color: #fff; border: 0; }
  li:nth-child(3) .rank { background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #fff; border: 0; }
  .t { font-size: 14px; line-height: 1.55; flex: 1; }
  .t mark { background: rgba(79, 70, 229, .18); color: inherit; border-radius: 4px; padding: 0 2px; }
  .pill {
    font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 6px;
    margin-left: 6px; vertical-align: 1px; white-space: nowrap;
  }
  .pill.new { background: #ff6600; color: #fff; }
  .pill.up { background: #f43f5e; color: #fff; }
  .pill.down { background: #94a3b8; color: #fff; }
  .thumb {
    width: 64px; height: 44px; object-fit: cover; border-radius: 8px; flex-shrink: 0;
    background: var(--hover);
  }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 14px; color: var(--faint); font-size: 12px;
    border-top: 1px dashed var(--line); margin-top: auto;
  }
  .card-foot a { color: var(--accent); text-decoration: none; font-weight: 600; }

  .skel { padding: 8px; }
  .skel div {
    height: 16px; border-radius: 8px; margin: 12px 10px;
    background: linear-gradient(90deg, var(--hover) 25%, var(--line) 50%, var(--hover) 75%);
    background-size: 200% 100%; animation: shimmer 1.2s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .err {
    margin: 12px; padding: 14px; border-radius: 12px; font-size: 13px;
    background: rgba(244, 63, 94, .08); border: 1px solid rgba(244, 63, 94, .3);
    color: #e11d48;
  }
  [data-theme="dark"] .err { color: #fda4af; }
  footer { margin-top: 30px; color: var(--faint); font-size: 12.5px; text-align: center; }
  footer a { color: var(--muted); }
  @media (max-width: 480px) {
    .wrap { padding: 18px 14px 48px; }
    .grid { grid-template-columns: 1fr; }
    .search { min-width: 0; flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="title">
      <h1>热点聚合 · 我的资讯墙</h1>
      <p>精选 <b>13</b> 个源 · 知乎热搜 / 知乎热榜 / V2EX / IT之家AI / 虎嗅 / Linux DO / 果壳 / 中关村 / 豆瓣 / ZAKER / 51CTO / 推文起爆榜 / 最热曝光 · 打开即看最新</p>
    </div>
    <div class="toolbar">
      <label class="search">🔍 <input id="q" type="search" placeholder="筛选关键词…"></label>
      <button class="btn" id="themeBtn" title="切换深浅色">🌓 主题</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <p class="meta" id="meta">正在加载…</p>
  <main class="grid" id="grid"></main>
  <footer>数据来源 <a href="https://allnet.hot/" target="_blank" rel="noopener">allnet.hot</a> 各详情页 · 点击标题跳转原文 · 缓存约 5 分钟</footer>
</div>

<script>
const FALLBACK = [
  { key: "zhihu-hot", name: "知乎热搜", id: 76, desc: "知乎实时热搜", accent: "#0066ff", glyph: "知", cat: "news" },
  { key: "zhihu-top", name: "知乎热榜", id: 13, desc: "知乎热榜讨论", accent: "#4c7df0", glyph: "榜", cat: "news" },
  { key: "v2ex", name: "V2EX 最新", id: 1199, desc: "创意工作者社区", accent: "#334155", glyph: "V", cat: "bbs" },
  { key: "ithome-ai", name: "IT 之家 AI", id: 143, desc: "AI 科技资讯", accent: "#d32f2f", glyph: "AI", cat: "tech" },
  { key: "huxiu", name: "虎嗅网最新", id: 473, desc: "商业科技评论", accent: "#f59e0b", glyph: "虎", cat: "tech" },
  { key: "linuxdo", name: "Linux DO", id: 308, desc: "技术社区新帖", accent: "#10b981", glyph: "L", cat: "bbs" },
  { key: "guokr", name: "果壳首页推荐", id: 124, desc: "科技科普推荐", accent: "#65a30d", glyph: "果", cat: "tech" },
  { key: "zol", name: "中关村最新资讯", id: 702, desc: "数码科技资讯", accent: "#0284c7", glyph: "中", cat: "tech", origin: "https://allnet.hot/detail/702" },
  { key: "douban", name: "豆瓣实时热门", desc: "实时热门讨论", accent: "#007722", glyph: "豆", cat: "news", origin: "https://top.open2hub.com/" },
  { key: "zaker", name: "ZAKER 新闻", desc: "新闻频道热点", accent: "#e11d48", glyph: "Z", cat: "news", origin: "https://top.open2hub.com/channel/news" },
  { key: "cto51", name: "51CTO 推荐", desc: "技术干货推荐", accent: "#c2410c", glyph: "51", cat: "tech", origin: "https://top.open2hub.com/channel/tech" },
  { key: "tweet", name: "推文起爆榜", desc: "X 中文热门推文", accent: "#64748b", glyph: "X", cat: "news", origin: "https://sopilot.net/rank" },
  { key: "tweet-hot", name: "推文最热曝光", desc: "6 小时曝光最高", accent: "#0f766e", glyph: "爆", cat: "news", origin: "https://sopilot.net/zh/rank/tweets?range=6h" },
];
const CATS = [
  { k: "all", label: "全部" },
  { k: "news", label: "综合" },
  { k: "tech", label: "科技" },
  { k: "bbs", label: "社区" },
];
const state = { sources: FALLBACK, keyword: "", updated: {}, tab: localStorage.getItem("hot-tab") || "all" };
function setTab(k) {
  state.tab = k;
  localStorage.setItem("hot-tab", k);
  document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.cat === k));
  state.sources.forEach((s) => {
    const card = $("#card-" + s.key);
    if (card) card.classList.toggle("hidden", k !== "all" && (s.cat || "news") !== k);
  });
  window.scrollTo({ top: 0, behavior: "smooth" });
}
window.setTab = setTab;

const $ = (s) => document.querySelector(s);
const esc = (s) => (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function hi(text) {
  const k = state.keyword.trim();
  if (!k) return esc(text);
  const i = text.toLowerCase().indexOf(k.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + k.length)) + "</mark>" + esc(text.slice(i + k.length));
}
function pill(s) {
  if (s === "new") return '<span class="pill new">新</span>';
  if (s === "up") return '<span class="pill up">升</span>';
  if (s === "down") return '<span class="pill down">降</span>';
  return "";
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

// 主题:没手动选过 -> 进来先亮色,之后跟随系统切换;手动点过一次 -> 就听用户的,不再跟系统
const root = document.documentElement;
const mq = matchMedia("(prefers-color-scheme: dark)");
const storedTheme = localStorage.getItem("hot-theme");
let followSys = !storedTheme;
root.dataset.theme = storedTheme || "";
if (mq.addEventListener) mq.addEventListener("change", () => {
  if (!followSys) return;
  root.dataset.theme = mq.matches ? "dark" : "";
});
$("#themeBtn").onclick = () => {
  followSys = false;
  root.dataset.theme = root.dataset.theme === "dark" ? "" : "dark";
  localStorage.setItem("hot-theme", root.dataset.theme);
};

function renderShell() {
  $("#tabs").innerHTML = CATS.map((c) =>
    `<button class="tab${state.tab === c.k ? " active" : ""}" data-cat="${c.k}" onclick="setTab('${c.k}')">${c.label}</button>`
  ).join("");
  $("#grid").innerHTML = state.sources.map((s) => `
    <section class="card${state.tab !== "all" && (s.cat || "news") !== state.tab ? " hidden" : ""}" style="--ac:${s.accent}" id="card-${s.key}">
      <div class="card-head">
        <div class="logo">${esc(s.glyph || s.name[0])}</div>
        <h2>${esc(s.name)}<small>${esc(s.desc || "")}</small></h2>
        <span class="count" id="count-${s.key}">…</span>
      </div>
      <div class="skel" id="body-${s.key}">${"<div></div>".repeat(8)}</div>
      <div class="card-foot"><span id="time-${s.key}">等待加载</span><a href="${esc(s.origin || ("https://allnet.hot/detail/" + s.id))}" target="_blank" rel="noopener">原站 ↗</a></div>
    </section>`).join("");
}

function paint(key, items, updatedAt) {
  const k = state.keyword.trim().toLowerCase();
  const shown = k ? items.filter((x) => x.title.toLowerCase().includes(k)) : items;
  $("#count-" + key).textContent = k ? shown.length + " / " + items.length + " 条" : "共 " + items.length + " 条";
  $("#body-" + key).outerHTML = `<ul class="list" id="body-${key}">` + shown.map((x) => `
    <li><a href="${esc(x.url)}" target="_blank" rel="noopener">
      <span class="rank">${x.rank}</span>
      <span class="t">${hi(x.title)}${pill(x.status)}</span>
      ${x.image ? `<img class="thumb" src="${esc(x.image)}" loading="lazy" referrerpolicy="no-referrer" alt="">` : ""}
    </a></li>`).join("") + `</ul>`;
  if (updatedAt) {
    state.updated[key] = updatedAt;
    $("#time-" + key).textContent = "更新于 " + fmtTime(updatedAt);
  }
  const times = Object.values(state.updated);
  if (times.length) $("#meta").textContent = "共 " + state.sources.length + " 个栏目 · 最近更新 " + fmtTime(times.sort().at(-1));
}

function fail(key, msg) {
  const el = $("#body-" + key);
  if (el) el.outerHTML = `<div id="body-${key}"><div class="err">加载失败:${esc(msg)} <a href="#" onclick="loadOne('${key}');return false;">重试</a></div></div>`;
  $("#time-" + key).textContent = "加载失败";
}

async function loadOne(key) {
  try {
    const r = await fetch("/api/hot?key=" + key, { cache: "no-store" });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || ("HTTP " + r.status));
    paint(key, d.items || [], d.updatedAt);
  } catch (e) {
    fail(key, String((e && e.message) || e));
  }
}
window.loadOne = loadOne;

async function loadAll() {
  $("#meta").textContent = "正在加载 " + state.sources.length + " 个栏目…";
  await Promise.all(state.sources.map((s) => loadOne(s.key)));
}

let deb = null;
$("#q").addEventListener("input", (e) => {
  clearTimeout(deb);
  deb = setTimeout(async () => {
    state.keyword = e.target.value || "";
    // 关键词只做前端过滤,不重新抓取
    for (const s of state.sources) {
      try {
        const r = await fetch("/api/hot?key=" + s.key);
        const d = await r.json();
        if (d.ok) paint(s.key, d.items || [], null);
      } catch (_) { /* 忽略 */ }
    }
  }, 250);
});

(async function init() {
  renderShell();
  try {
    const r = await fetch("/api/sources");
    const d = await r.json();
    if (d.ok && d.sources && d.sources.length) state.sources = d.sources;
    renderShell();
  } catch (_) { /* 用内置清单兜底 */ }
  loadAll();
})();
</script>
</body>
</html>
